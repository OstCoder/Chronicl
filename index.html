<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/chronicl-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chronicl — Follow every angle of a breaking story</title>
    <meta
      name="description"
      content="Chronicl follows breaking civic stories across outlets into one live page: grouped storylines, dated timelines, every source linked, with third-party bias context. Free, no account."
    />
    <link rel="canonical" href="https://chronicl-ten.vercel.app/" />

    <!-- Open Graph / social card: linked posts render with title, blurb and
         preview image instead of a blank card (audit #4). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chronicl" />
    <meta property="og:url" content="https://chronicl-ten.vercel.app/" />
    <meta property="og:title" content="Chronicl — Follow every angle of a breaking story" />
    <meta
      property="og:description"
      content="Grouped storylines, dated timelines, every source linked, and bias context kept visible — one live page per breaking story."
    />
    <meta property="og:image" content="https://chronicl-ten.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Chronicl: one live page that follows every angle of a breaking story" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Chronicl — Follow every angle of a breaking story" />
    <meta
      name="twitter:description"
      content="Grouped storylines, dated timelines, every source linked, and bias context kept visible — one live page per breaking story."
    />
    <meta name="twitter:image" content="https://chronicl-ten.vercel.app/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
